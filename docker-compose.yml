version: '3.8'

services:
  jenkins-master:
    image: jenkins/jenkins:lts
    container_name: jenkins-master
    ports:
      - "8080:8080"   # Jenkins web UI
      - "50000:50000" # Agent (JNLP) communication port
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-net
    restart: unless-stopped

  linux-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: linux-agent
    hostname: linux-node
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${SSH_PUBKEY}
    networks:
      - jenkins-net
    restart: unless-stopped

networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
